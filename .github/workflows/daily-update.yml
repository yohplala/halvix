# Daily automated pipeline: Fetch data → Calculate TOTAL2 → Deploy to GitHub Pages.
# Runs every day at 4:00 AM UTC. This is a thin orchestrator: each step calls a
# reusable workflow (workflow_call) so the actual logic lives in exactly one
# place and can also be triggered manually on its own.
name: Daily Update

on:
  # Daily at 4:00 AM UTC. The cross-provider coin-identity registry (committed
  # seed + bindings persisted on the raw-data branch) routes CoinGecko data onto
  # the right parquet, so automated runs no longer risk splicing onto the wrong
  # history.
  schedule:
    - cron: '0 4 * * *'

  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: 'Skip fetching new data (use existing raw-data)'
        required: false
        default: false
        type: boolean

# GITHUB_TOKEN permissions — must be a superset of every called workflow's needs
# (contents: write to push data branches; pages/id-token to deploy).
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent run
concurrency:
  group: "daily-update"
  cancel-in-progress: false

jobs:
  # Step 1: Fetch raw data → push to the raw-data branch.
  # Scoped to the top 300 coins by market cap (free-tier friendly; full history
  # is already cached on the raw-data branch).
  fetch:
    if: ${{ github.event.inputs.skip_fetch != 'true' }}
    uses: ./.github/workflows/fetch-raw-data.yml
    with:
      limit: '300'
    secrets: inherit

  # Step 2: Calculate the TOTAL2 index → push to the processed-data branch.
  # Runs even when fetch is skipped (skip_fetch=true) using existing data.
  calculate:
    needs: [fetch]
    if: ${{ always() && (needs.fetch.result == 'success' || needs.fetch.result == 'skipped') }}
    uses: ./.github/workflows/calculate-total2.yml
    secrets: inherit

  # Step 3: Generate charts and deploy to GitHub Pages.
  deploy:
    needs: [calculate]
    if: ${{ always() && needs.calculate.result == 'success' }}
    uses: ./.github/workflows/pages.yml
    secrets: inherit
