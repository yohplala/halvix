[tool.poetry]
name = "halvix"
version = "2026.06.0"
description = "Cryptocurrency price analysis relative to Bitcoin halving cycles"
authors = ["yohplala <yohplala@users.noreply.github.com>"]
readme = "README.md"
packages = [
    {include = "config.py", from = "src"},
    {include = "main.py", from = "src"},
    {include = "analysis", from = "src"},
    {include = "api", from = "src"},
    {include = "data", from = "src"},
    {include = "utils", from = "src"},
    {include = "visualization", from = "src"},
]

[tool.poetry.dependencies]
python = "^3.14"
pandas = "^3.0"
numpy = "^2.2"
scipy = "^1.18"
plotly = "^6.8"
requests = "^2.32"
tqdm = "^4.67"
pyarrow = "^24.0"
tenacity = "^9.1"
jinja2 = "^3.1.6"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
pytest-cov = "^7.1"
black = "^26.5"
ruff = "^0.15"
mypy = "^2.1"
ipython = "^9.14"
pre-commit = "^4.6"

[tool.poetry.scripts]
halvix = "main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
# Pinned to py313 on purpose: under py314 black applies PEP 758 and drops the
# parentheses in multi-exception `except (A, B):` clauses, which reads like a
# Python-2 bug. py313 formatting is forward-compatible with 3.14.
target-version = ['py313']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
# src/ is on the path, so first-party imports use the module names directly.
known-first-party = ["analysis", "api", "config", "data", "main", "utils", "visualization"]

[tool.mypy]
python_version = "3.14"
# src/ is on the path (not an installed package), so resolve modules from there.
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
# Third-party libs (pandas, plotly, scipy, …) ship partial or no stubs.
ignore_missing_imports = true
# Lenient by design: type the public surface, don't force annotations everywhere.
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = [
    "src/main.py",           # CLI entry point - tested via integration
    "src/visualization/*",   # UI code - tested visually
    "src/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
