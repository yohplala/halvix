<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Halvix{% endblock %}</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-orange: #f7931a;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --border-color: #30363d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            padding: 0.5rem 2rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            position: relative;
        }

        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 1.1rem;
            position: absolute;
            left: 1.25rem;
        }

        .back-link:hover {
            color: var(--accent-blue);
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo {
            font-size: 1.25rem;
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent-orange), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        footer {
            text-align: center;
            padding: 0.75rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.75rem;
        }

        footer a {
            color: var(--accent-blue);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        footer .last-updated {
            opacity: 0.8;
        }

        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body>
    <header>
        <a href="{{ back_link | default('../index.html') }}" class="back-link">&#8592; Back</a>
        <div class="header-content">
            <span class="logo">&#x1f4ca;</span>
            <h1>Halvix</h1>
        </div>
    </header>

    {% block content %}{% endblock %}

    <footer>
        <p>
            Generated by <strong>Halvix</strong> &bull;
            <a href="https://github.com/yohplala/halvix">Source Code</a> &bull;
            Data from <a href="https://www.coingecko.com/">CoinGecko</a>
            {% if last_updated %}
            <span class="last-updated">&bull; Last updated: {{ last_updated }}</span>
            {% endif %}
        </p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
